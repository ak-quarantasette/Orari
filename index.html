<html lang="it" dir="ltr">
<head>
<meta charset="utf-8">

<title>Pulizie di casa</title>
<meta name="description" content="Turni settimanali delle pulizie: cucina, bagno, corridoio.">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<script>
  // Applica tema e lingua prima del primo paint (niente flash).
  (function () {
    try {
      var t = localStorage.getItem("pulizie.theme");
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  })();
</script>
<style>
  /* =========================================================
     Tokens
     ========================================================= */
  :root {
    color-scheme: light;
    --bg: #f5f5f7;
    --surface: #ffffff;
    --surface-2: #fafafc;
    --text: #1d1d1f;
    --text-2: #6e6e73;
    --text-3: #86868b;
    --text-4: #aeaeb2;
    --line: rgba(0, 0, 0, 0.08);
    --line-strong: rgba(0, 0, 0, 0.14);
    --shadow: 0 0.5px 1px rgba(0,0,0,.04), 0 6px 24px -6px rgba(0,0,0,.08);
    --shadow-lg: 0 1px 2px rgba(0,0,0,.04), 0 24px 60px -18px rgba(0,0,0,.18);
    --nav: rgba(245, 245, 247, 0.72);
    --pop: rgba(255, 255, 255, 0.82);
    --fill: rgba(118, 118, 128, 0.12);
    --fill-2: rgba(118, 118, 128, 0.08);
    --thumb: #ffffff;
    --focus: #0071e3;

    --andrea: #0071e3;
    --ludovico: #e35d0b;
    --saeed: #1a9a52;
    --andrea-tint: rgba(0, 113, 227, 0.10);
    --ludovico-tint: rgba(227, 93, 11, 0.10);
    --saeed-tint: rgba(26, 154, 82, 0.10);
    --neutral: #8e8e93;

    --stage-bg: #fbfbfd;
    --glow-opacity: .22;

    --radius: 24px;
    --ease: cubic-bezier(.22, .8, .2, 1);
    --spring: cubic-bezier(.34, 1.36, .64, 1);

    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Helvetica Neue", "SF Arabic", "Noto Sans Arabic", "Geeza Pro", Helvetica, Arial, sans-serif;
    --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Helvetica Neue", "SF Arabic", "Noto Sans Arabic", "Geeza Pro", Helvetica, Arial, sans-serif;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #000000;
    --surface: #1c1c1e;
    --surface-2: #232325;
    --text: #f5f5f7;
    --text-2: #a1a1a6;
    --text-3: #86868b;
    --text-4: #636366;
    --line: rgba(255, 255, 255, 0.09);
    --line-strong: rgba(255, 255, 255, 0.16);
    --shadow: 0 0 0 0.5px rgba(255,255,255,.06);
    --shadow-lg: 0 0 0 0.5px rgba(255,255,255,.08), 0 30px 80px -20px rgba(0,0,0,.8);
    --nav: rgba(0, 0, 0, 0.66);
    --pop: rgba(44, 44, 46, 0.82);
    --fill: rgba(118, 118, 128, 0.24);
    --fill-2: rgba(118, 118, 128, 0.16);
    --thumb: #636366;
    --focus: #2997ff;

    --andrea: #2997ff;
    --ludovico: #ff9f0a;
    --saeed: #30d158;
    --andrea-tint: rgba(41, 151, 255, 0.16);
    --ludovico-tint: rgba(255, 159, 10, 0.16);
    --saeed-tint: rgba(48, 209, 88, 0.16);
    --neutral: #8e8e93;

    --stage-bg: #000000;
    --glow-opacity: .34;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #000000;
      --surface: #1c1c1e;
      --surface-2: #232325;
      --text: #f5f5f7;
      --text-2: #a1a1a6;
      --text-3: #86868b;
      --text-4: #636366;
      --line: rgba(255, 255, 255, 0.09);
      --line-strong: rgba(255, 255, 255, 0.16);
      --shadow: 0 0 0 0.5px rgba(255,255,255,.06);
      --shadow-lg: 0 0 0 0.5px rgba(255,255,255,.08), 0 30px 80px -20px rgba(0,0,0,.8);
      --nav: rgba(0, 0, 0, 0.66);
      --pop: rgba(44, 44, 46, 0.82);
      --fill: rgba(118, 118, 128, 0.24);
      --fill-2: rgba(118, 118, 128, 0.16);
      --thumb: #636366;
      --focus: #2997ff;
      --andrea: #2997ff;
      --ludovico: #ff9f0a;
      --saeed: #30d158;
      --andrea-tint: rgba(41, 151, 255, 0.16);
      --ludovico-tint: rgba(255, 159, 10, 0.16);
      --saeed-tint: rgba(48, 209, 88, 0.16);
      --stage-bg: #000000;
      --glow-opacity: .34;
    }
  }

  /* =========================================================
     Base
     ========================================================= */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 17px;
    line-height: 1.47;
    letter-spacing: -0.022em;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    min-height: 100vh;
    transition: background-color .5s var(--ease), color .5s var(--ease);
  }
  :root[lang="ar"] body, :root[lang="ar"] body * { letter-spacing: 0 !important; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  b, strong { font-weight: 600; color: var(--text); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* =========================================================
     Nav bar (vetro)
     ========================================================= */
  .nav {
    position: sticky; top: 0; z-index: 20;
    background: var(--nav);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 0.5px solid transparent;
    transition: border-color .3s var(--ease), background-color .5s var(--ease);
    padding-top: env(safe-area-inset-top);
  }
  .nav.scrolled { border-bottom-color: var(--line); }
  .nav-in {
    max-width: 920px; margin: 0 auto;
    height: 52px; padding: 0 20px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 17px; letter-spacing: -0.02em; }
  .brand-mark {
    width: 26px; height: 26px; border-radius: 7px;
    background: var(--text); color: var(--bg);
    display: grid; place-items: center;
    transition: background-color .5s var(--ease), color .5s var(--ease);
  }
  .brand-mark svg { width: 16px; height: 16px; }
  .actions { display: flex; align-items: center; gap: 6px; }
  .icon-btn {
    height: 34px; min-width: 34px; padding: 0 10px;
    border-radius: 999px;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 14px; font-weight: 500; letter-spacing: -0.01em;
    color: var(--text);
    transition: background-color .2s var(--ease), transform .2s var(--ease);
  }
  .icon-btn:hover { background: var(--fill-2); }
  .icon-btn:active { transform: scale(.94); }
  .icon-btn svg { width: 18px; height: 18px; flex: none; }
  .icon-btn.solid { background: var(--text); color: var(--bg); padding: 0 14px 0 12px; }
  .icon-btn.solid:hover { background: var(--text); opacity: .86; }
  .theme-btn svg { transition: transform .5s var(--spring), opacity .3s; }
  .theme-btn .sun, .theme-btn .moon { position: absolute; }
  .theme-btn { position: relative; width: 34px; padding: 0; }
  :root[data-eff-theme="dark"] .theme-btn .moon { opacity: 0; transform: rotate(-90deg) scale(.5); }
  :root[data-eff-theme="light"] .theme-btn .sun { opacity: 0; transform: rotate(90deg) scale(.5); }

  /* Lingua: popover */
  .lang { position: relative; }
  .lang-code { font-variant-caps: all-small-caps; font-size: 15px; letter-spacing: .02em; }
  .menu {
    position: absolute; top: calc(100% + 8px); inset-inline-end: -6px;
    min-width: 196px; padding: 6px;
    background: var(--pop);
    -webkit-backdrop-filter: saturate(180%) blur(30px);
    backdrop-filter: saturate(180%) blur(30px);
    border-radius: 14px;
    box-shadow: var(--shadow-lg), 0 0 0 0.5px var(--line-strong);
    opacity: 0; transform: translateY(-6px) scale(.97); transform-origin: top right;
    pointer-events: none;
    transition: opacity .2s var(--ease), transform .25s var(--ease);
  }
  [dir="rtl"] .menu { transform-origin: top left; }
  .menu.open { opacity: 1; transform: none; pointer-events: auto; }
  .menu button {
    width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 9px 12px; border-radius: 9px; font-size: 15px; text-align: start;
  }
  .menu button:hover { background: var(--fill-2); }
  .menu button small { color: var(--text-3); font-size: 13px; }
  .menu .check { width: 16px; height: 16px; color: var(--focus); opacity: 0; }
  .menu button[aria-checked="true"] .check { opacity: 1; }
  .menu-item-l { display: flex; flex-direction: column; line-height: 1.25; }

  /* =========================================================
     Layout
     ========================================================= */
  .wrap { max-width: 920px; margin: 0 auto; padding: 56px 20px 72px; }

  /* Hero */
  .hero { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 24px 40px; }
  .eyebrow { font-size: 15px; font-weight: 600; color: var(--text-3); margin-bottom: 10px; letter-spacing: -0.01em; }
  .hero-title {
    font-family: var(--font-display);
    font-size: clamp(44px, 8.4vw, 76px);
    line-height: 1.02;
    font-weight: 700;
    letter-spacing: -0.04em;
  }
  .hero-title .muted { color: var(--text-4); }
  .hero-sub { margin-top: 16px; font-size: clamp(17px, 2.3vw, 21px); color: var(--text-2); letter-spacing: -0.016em; max-width: 34ch; }

  /* Strip della settimana */
  .strip {
    display: grid; grid-template-columns: repeat(7, 36px); gap: 4px;
    padding: 12px; border-radius: 20px; background: var(--surface); box-shadow: var(--shadow);
  }
  .strip-day { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .strip-day .l { font-size: 11px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: .02em; }
  .strip-day .n {
    width: 32px; height: 32px; border-radius: 50%;
    display: grid; place-items: center;
    font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums;
    color: var(--text-2);
    position: relative;
  }
  .strip-day.sat .n { color: var(--text); font-weight: 700; box-shadow: inset 0 0 0 1.5px var(--text); }
  .strip-day.sun .n { color: var(--text); box-shadow: inset 0 0 0 1.5px var(--text-4); }
  .strip-day.sun .n::before { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 1.5px dashed var(--text-3); opacity: 0; }
  .strip-day.today .n { background: var(--text); color: var(--bg); box-shadow: none; font-weight: 700; }
  .strip-day.past .n { color: var(--text-4); }

  /* Toolbar */
  .toolbar { margin-top: 40px; display: flex; align-items: center; justify-content: space-between; gap: 12px 16px; flex-wrap: wrap; }
  .weeknav { display: flex; align-items: center; gap: 4px; }
  .chev { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--fill-2); transition: background-color .2s, transform .2s var(--ease); }
  .chev:hover { background: var(--fill); }
  .chev:active { transform: scale(.92); }
  .chev svg { width: 16px; height: 16px; }
  [dir="rtl"] .chev svg { transform: scaleX(-1); }
  .today-btn {
    margin-inline-start: 6px; height: 34px; padding: 0 14px; border-radius: 999px;
    font-size: 14px; font-weight: 600; color: var(--focus);
    background: transparent;
    opacity: 0; pointer-events: none; transform: translateX(-4px);
    transition: opacity .3s var(--ease), transform .3s var(--ease), background-color .2s;
  }
  .today-btn.show { opacity: 1; pointer-events: auto; transform: none; }
  .today-btn:hover { background: var(--fill-2); }

  .seg {
    position: relative; display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr;
    background: var(--fill); border-radius: 10px; padding: 2px; max-width: 100%;
  }
  .seg-thumb {
    position: absolute; top: 2px; bottom: 2px; left: 0;
    border-radius: 8px; background: var(--thumb);
    box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 3px 1px rgba(0,0,0,.04);
    transition: transform .4s var(--ease), width .4s var(--ease);
  }
  .seg button {
    position: relative; z-index: 1;
    font-size: 14px; font-weight: 500; letter-spacing: -0.01em;
    padding: 6px 16px; border-radius: 8px; white-space: nowrap;
    transition: font-weight .2s;
  }
  .seg button[aria-pressed="true"] { font-weight: 600; }

  /* Cards */
  .cards { margin-top: 18px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .card {
    position: relative; overflow: hidden;
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 24px;
    min-height: 236px;
    display: flex; flex-direction: column;
    transition: opacity .45s var(--ease), transform .45s var(--ease), box-shadow .45s var(--ease), background-color .5s var(--ease);
  }
  @media (hover: hover) { .card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); } }
  .card::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit;
    box-shadow: inset 0 0 0 2px var(--accent); opacity: 0;
    transition: opacity .4s var(--ease); pointer-events: none;
  }
  .card.is-mine::after { opacity: 1; }
  .card.is-dim { opacity: .36; transform: scale(.985); }
  .card-icon {
    width: 46px; height: 46px; border-radius: 13px;
    display: grid; place-items: center;
    background: var(--tint); color: var(--accent);
  }
  .card-icon svg { width: 24px; height: 24px; }
  .card-area { margin-top: 18px; font-size: 15px; font-weight: 600; color: var(--text-3); letter-spacing: -0.01em; }
  .card-person {
    margin-top: auto; padding-top: 6px;
    font-family: var(--font-display);
    font-size: 34px; font-weight: 700; letter-spacing: -0.032em; line-height: 1.08;
  }
  .card-tag {
    position: absolute; top: 24px; inset-inline-end: 24px;
    font-size: 12px; font-weight: 600; color: var(--accent);
    background: var(--tint); padding: 4px 10px; border-radius: 999px;
    opacity: 0; transform: translateY(-4px);
    transition: opacity .35s var(--ease), transform .35s var(--ease);
  }
  .card.is-mine .card-tag { opacity: 1; transform: none; }
  .swap { animation: swap .55s var(--ease) both; }
  .swap:nth-child(2) { animation-delay: .05s; }
  .swap:nth-child(3) { animation-delay: .1s; }
  @keyframes swap { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  /* Nota */
  .note {
    margin-top: 16px; display: flex; align-items: center; gap: 12px;
    font-size: 15px; color: var(--text-2);
    padding: 15px 20px; background: var(--surface); border-radius: 18px; box-shadow: var(--shadow);
    transition: background-color .5s var(--ease);
  }
  .note svg { flex: none; width: 20px; height: 20px; color: var(--text-3); }

  /* Tabella */
  .section-title { margin-top: 72px; font-family: var(--font-display); font-size: 32px; font-weight: 700; letter-spacing: -0.034em; line-height: 1.1; }
  .section-sub { margin-top: 6px; font-size: 17px; color: var(--text-2); }
  .table { margin-top: 22px; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; transition: background-color .5s var(--ease); }
  .row { display: grid; grid-template-columns: 1.2fr 1fr 1fr 1fr; align-items: center; gap: 12px; padding: 15px 24px; border-top: 0.5px solid var(--line); }
  .row:first-child { border-top: 0; }
  .row.head { padding-top: 14px; padding-bottom: 12px; font-size: 12px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.05em; }
  .row.is-now { background: var(--fill-2); }
  .people { display: contents; }
  .date { font-weight: 600; letter-spacing: -0.015em; font-variant-numeric: tabular-nums; }
  .date small { display: block; font-size: 13px; font-weight: 400; color: var(--text-3); letter-spacing: -0.005em; }
  .badge-now {
    display: inline-block; margin-inline-start: 6px; font-size: 11px; font-weight: 600;
    color: var(--bg); background: var(--text); padding: 1px 7px; border-radius: 999px; vertical-align: 2px;
  }
  .who { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; transition: opacity .35s var(--ease); }
  .who .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
  .who.is-dim { opacity: .28; }
  .who.is-mine { font-weight: 600; }
  .who .area-m { display: none; color: var(--text-3); font-weight: 400; }

  footer { margin-top: 56px; font-size: 13px; color: var(--text-3); text-align: center; }

  /* Ingresso */
  .rise { animation: rise .8s var(--ease) both; }
  .d1 { animation-delay: .05s; } .d2 { animation-delay: .12s; } .d3 { animation-delay: .19s; } .d4 { animation-delay: .26s; }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

  /* =========================================================
     Standby / presentazione
     ========================================================= */
  .stage {
    position: fixed; inset: 0; z-index: 100;
    background: var(--stage-bg);
    color: var(--text);
    overflow: hidden;
    display: grid; grid-template-rows: auto 1fr auto;
    padding: max(28px, env(safe-area-inset-top)) max(32px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(32px, env(safe-area-inset-left));
    opacity: 0; visibility: hidden;
    transition: opacity .6s var(--ease), visibility 0s linear .6s, background-color .5s var(--ease);
  }
  .stage.open { opacity: 1; visibility: visible; transition: opacity .6s var(--ease), visibility 0s; }
  .stage.idle { cursor: none; }
  .glow {
    position: absolute; border-radius: 50%;
    width: 70vmax; height: 70vmax;
    background-color: var(--accent, var(--neutral));
    filter: blur(110px);
    opacity: var(--glow-opacity);
    transition: background-color 1.6s var(--ease);
    pointer-events: none;
    will-change: transform;
  }
  .glow.g1 { top: -30vmax; left: -20vmax; animation: drift1 26s ease-in-out infinite alternate; }
  .glow.g2 { bottom: -38vmax; right: -24vmax; width: 60vmax; height: 60vmax; opacity: calc(var(--glow-opacity) * .7); animation: drift2 32s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform: translate(14vmax, 10vmax) scale(1.12); } }
  @keyframes drift2 { to { transform: translate(-12vmax, -8vmax) scale(.9); } }
  .grain {
    position: absolute; inset: 0; pointer-events: none; opacity: .5;
    background: radial-gradient(ellipse at center, transparent 40%, var(--stage-bg) 100%);
  }
  .stage-top, .stage-body, .stage-bottom { position: relative; z-index: 1; }

  .stage-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .stage-when { font-size: clamp(15px, 1.6vw, 20px); font-weight: 600; color: var(--text-2); letter-spacing: -0.015em; }
  .stage-when span { display: block; font-weight: 400; color: var(--text-3); }
  .stage-clock {
    font-family: var(--font-display);
    font-size: clamp(28px, 4.4vw, 56px); font-weight: 300; letter-spacing: -0.03em; line-height: 1;
    font-variant-numeric: tabular-nums; color: var(--text);
  }

  .stage-body { display: grid; place-items: center; text-align: center; padding: 2vh 0; }
  .slide { display: flex; flex-direction: column; align-items: center; transition: opacity .45s var(--ease), transform .45s var(--ease), filter .45s var(--ease); }
  .slide.out { opacity: 0; transform: translateY(-14px) scale(.985); filter: blur(8px); }
  .s-in { animation: sIn 1s var(--ease) both; }
  .s-in.k1 { animation-delay: .06s; } .s-in.k2 { animation-delay: .16s; } .s-in.k3 { animation-delay: .28s; } .s-in.k4 { animation-delay: .4s; } .s-in.k5 { animation-delay: .52s; }
  .s-extra {
    margin-top: clamp(16px, 2.8vmin, 30px);
    display: inline-flex; align-items: center; gap: .5em;
    padding: .45em 1em .45em .8em; border-radius: 999px;
    background: var(--tint); color: var(--text);
    font-size: clamp(16px, 2.6vmin, 26px); font-weight: 600; letter-spacing: -0.015em;
  }
  .s-extra svg { width: 1.15em; height: 1.15em; color: var(--accent); }
  @keyframes sIn { from { opacity: 0; transform: translateY(26px); filter: blur(10px); } to { opacity: 1; transform: none; filter: none; } }

  .s-icon {
    width: clamp(64px, 9vmin, 108px); height: clamp(64px, 9vmin, 108px);

  }
  .s-icon svg { width: 52%; height: 52%; }
  .s-area { margin-top: clamp(18px, 3.2vmin, 36px); font-size: clamp(20px, 3.4vmin, 36px); font-weight: 600; color: var(--text-2); letter-spacing: -0.02em; }
  .s-name {
    font-family: var(--font-display);

    font-weight: 700; letter-spacing: -0.05em; line-height: .98;

  }
  .s-meta { margin-top: clamp(14px, 2.6vmin, 28px); font-size: clamp(16px, 2.4vmin, 24px); color: var(--text-3); letter-spacing: -0.015em; }

  .ov-title { font-family: var(--font-display); font-size: clamp(36px, 7vmin, 72px); font-weight: 700; letter-spacing: -0.045em; line-height: 1.04; }
  .ov-list { margin-top: clamp(24px, 5vmin, 56px); display: grid; gap: clamp(10px, 1.6vmin, 18px); width: min(720px, 86vw); }
  .ov-row {
    display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: clamp(14px, 2.4vmin, 24px);
    padding: clamp(14px, 2.2vmin, 22px) clamp(16px, 2.6vmin, 28px);
    border-radius: clamp(18px, 2.6vmin, 26px);
    background: var(--fill-2);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    text-align: start;
  }
  .ov-row .s-icon { width: clamp(40px, 6vmin, 60px); height: clamp(40px, 6vmin, 60px); }
  .ov-area { font-size: clamp(16px, 2.6vmin, 24px); color: var(--text-2); font-weight: 500; }
  .ov-name { font-family: var(--font-display); font-size: clamp(22px, 4vmin, 40px); font-weight: 700; letter-spacing: -0.03em; }

  .stage-bottom { display: flex; flex-direction: column; align-items: center; gap: 14px; padding-top: 12px; }
  .bars { display: flex; gap: 6px; width: min(360px, 60vw); }
  .bar { flex: 1; display: flex; height: 3px; border-radius: 3px; background: var(--fill); overflow: hidden; cursor: pointer; }
  .bar::before { content: ""; position: absolute; inset: -12px 0; }
  .bar { position: relative; }
  .bar i { display: block; height: 100%; width: 0; background: var(--text); border-radius: inherit; }

  .bar.cur i { animation: fill var(--dur, 8s) linear both; }
  @keyframes fill { to { width: 100%; } }
  .stage-hint { font-size: 13px; color: var(--text-3); transition: opacity .6s var(--ease); }
  .stage-close {
    position: absolute; top: max(20px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);

    font-size: 14px; font-weight: 600;
    background: var(--fill); color: var(--text);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);

  }
  .stage-close:hover { background: var(--line-strong); }
  .stage-close svg { width: 14px; height: 14px; }
  .stage.idle .stage-close, .stage.idle .stage-hint { opacity: 0; pointer-events: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    .bar.cur i { animation: none; width: 100%; }
  }

  /* =========================================================
     Tab: Turni / Checklist
     ========================================================= */
  :root { --ok: #34c759; --low: #ff9f0a; --empty: #ff3b30; }
  .nav-in { position: relative; }
  .tabs {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);

  .tabs a {
    display: inline-flex; align-items: center; gap: 6px;
    height: 30px; padding: 0 14px; border-radius: 999px;
    font-size: 14px; font-weight: 500; letter-spacing: -0.01em;
    color: var(--text-2); text-decoration: none;
    transition: background-color .25s var(--ease), color .25s var(--ease), box-shadow .25s var(--ease);
  }
  .tabs a svg { width: 16px; height: 16px; }
  .tabs a:hover { color: var(--text); }
  .tabs a[aria-current="page"] { background: var(--thumb); color: var(--text); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .tabbar { display: none; }
  body[data-view="checklist"] #standbyBtn { display: none; }
  .view[hidden] { display: none; }

  /* Spazzatura */
  .trash {
    margin-top: 16px;
    display: flex; align-items: center; gap: 16px;
    padding: 16px 20px 16px 16px;
    background: var(--surface); border-radius: 20px; box-shadow: var(--shadow);
    transition: opacity .45s var(--ease), transform .45s var(--ease), background-color .5s var(--ease);
  }
  [dir="rtl"] .trash { padding: 16px 16px 16px 20px; }
  .trash.is-dim { opacity: .36; transform: scale(.985); }
  .trash-icon {
    flex: none; width: 46px; height: 46px; border-radius: 13px;
    display: grid; place-items: center; background: var(--fill-2); color: var(--text-2);
  }
  .trash-icon svg { width: 24px; height: 24px; }
  .trash-text { flex: 1; min-width: 0; }
  .trash-title { font-weight: 600; letter-spacing: -0.015em; }
  .trash-sub { font-size: 14px; color: var(--text-3); }
  .trash-who { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    height: 32px; padding: 0 13px 0 11px; border-radius: 999px;
    background: var(--tint); color: var(--text);
    font-size: 15px; font-weight: 600; letter-spacing: -0.015em;
    transition: opacity .35s var(--ease), box-shadow .35s var(--ease);
  }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .chip.is-mine { box-shadow: inset 0 0 0 1.5px var(--accent); }
  .chip.is-dim { opacity: .4; }
  .card-area .tr, .who .tr { display: inline-block; width: 15px; height: 15px; vertical-align: -2px; margin-inline-start: 6px; color: var(--text-3); }
  .who .tr { width: 14px; height: 14px; margin-inline-start: 2px; }
  .legend-tr { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .legend-tr svg { width: 15px; height: 15px; color: var(--text-3); }

  /* =========================================================
     Checklist
     ========================================================= */
  .ck-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px 32px; flex-wrap: wrap; }
  .sync {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 13px; font-weight: 500; color: var(--text-3);
    padding: 5px 11px 5px 9px; border-radius: 999px; background: var(--fill-2);
    margin-bottom: 14px;
  }
  .sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--text-4); }
  .sync.online i { background: var(--ok); box-shadow: 0 0 0 3px rgba(52,199,89,.18); }
  .sync.offline i { background: var(--low); }
  .sync.connecting i { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }

  .cta {
    position: relative;
    display: inline-flex; align-items: center; gap: 10px;
    height: 52px; padding: 0 26px 0 22px; border-radius: 999px;
    background: var(--text); color: var(--bg);
    font-size: 17px; font-weight: 600; letter-spacing: -0.02em;
    transition: transform .25s var(--spring), opacity .2s, background-color .5s var(--ease), color .5s var(--ease);
  }
  .cta:hover { opacity: .88; }
  .cta:active { transform: scale(.96); }
  .cta svg { width: 21px; height: 21px; }
  .cta-badge {
    min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px;
    display: inline-grid; place-items: center;
    background: var(--empty); color: #fff; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums;
    transform: scale(1); transition: transform .35s var(--spring);
  }
  .cta-badge:empty { display: none; }
  .cta-badge.bump { animation: bump .4s var(--spring); }
  @keyframes bump { 40% { transform: scale(1.3); } }

  .group-title { margin: 40px 0 10px; padding: 0 4px; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--text-3); }
  .group-title:first-of-type { margin-top: 36px; }
  .list { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; transition: background-color .5s var(--ease); }
  .item { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 16px; padding: 16px 20px; border-top: 0.5px solid var(--line); }
  .item:first-child { border-top: 0; }
  .item-icon {
    width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center;
    background: var(--fill-2); color: var(--text-2);
  }
  .item-icon svg { width: 24px; height: 24px; }
  .item-main { min-width: 0; }
  .item-name { font-weight: 600; letter-spacing: -0.018em; }
  .item-meta { font-size: 14px; color: var(--text-3); margin-top: 1px; }
  .level { margin-top: 9px; height: 4px; border-radius: 4px; background: var(--fill); overflow: hidden; max-width: 240px; }
  .level i { display: block; height: 100%; border-radius: inherit; background: var(--ok); transition: width .5s var(--ease), background-color .4s var(--ease); }
  .item.low .level i { background: var(--low); }
  .item.empty .level i { background: var(--empty); }
  .stepper { display: flex; align-items: center; gap: 4px; }
  .step {
    width: 36px; height: 36px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--fill-2); color: var(--text);
    transition: background-color .2s, transform .2s var(--spring), opacity .2s;
  }
  .step:hover { background: var(--fill); }
  .step:active { transform: scale(.88); }
  .step:disabled { opacity: .3; cursor: default; transform: none; }
  .step svg { width: 16px; height: 16px; }
  .count { min-width: 52px; text-align: center; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .count b { display: block; font-family: var(--font-display); font-size: 22px; font-weight: 700; letter-spacing: -0.03em; }
  .count small { font-size: 12px; color: var(--text-3); }
  .item.empty .count b { color: var(--empty); }
  .count b.tick { animation: tick .3s var(--ease); }
  @keyframes tick { from { transform: translateY(-5px); opacity: .3; } }
  .fine { margin-top: 18px; padding: 0 4px; font-size: 13px; color: var(--text-3); line-height: 1.5; }

  /* Foglio "Spesa" */
  .sheet-wrap {
    position: fixed; inset: 0; z-index: 60;
    display: flex; align-items: flex-end; justify-content: center;
    visibility: hidden; pointer-events: none;
    transition: visibility 0s linear .45s;
  }
  .sheet-wrap.open { visibility: visible; pointer-events: auto; transition: visibility 0s; }
  .sheet-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.36); opacity: 0; transition: opacity .4s var(--ease); }
  .sheet-wrap.open .sheet-backdrop { opacity: 1; }
  .sheet {
    position: relative; width: min(560px, 100%); max-height: 90vh;
    display: flex; flex-direction: column;
    background: var(--surface); color: var(--text);
    border-radius: 28px 28px 0 0;
    box-shadow: var(--shadow-lg);
    padding-bottom: env(safe-area-inset-bottom);
    transform: translateY(100%);
    transition: transform .5s var(--ease), background-color .5s var(--ease);
  }
  .sheet-wrap.open .sheet { transform: none; }
  .grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--fill); margin: 8px auto 0; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px 6px; }
  .sheet-head h2 { font-family: var(--font-display); font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
  .sheet-x { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--fill-2); color: var(--text-2); }
  .sheet-x svg { width: 14px; height: 14px; }
  .sheet-sub { padding: 0 24px 8px; font-size: 15px; color: var(--text-3); }
  .sheet-body { overflow-y: auto; padding: 4px 12px; -webkit-overflow-scrolling: touch; }
  .buy {
    width: 100%; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px;
    padding: 12px; border-radius: 14px; text-align: start;
    transition: background-color .2s;
  }
  .buy:hover { background: var(--fill-2); }
  .box {
    width: 24px; height: 24px; border-radius: 50%;
    box-shadow: inset 0 0 0 1.5px var(--text-4);
    display: grid; place-items: center; color: #fff;
    transition: background-color .25s var(--ease), box-shadow .25s var(--ease);
  }
  .box svg { width: 14px; height: 14px; opacity: 0; transform: scale(.5); transition: opacity .2s, transform .3s var(--spring); }
  .buy.done .box { background: var(--focus); box-shadow: none; }
  .buy.done .box svg { opacity: 1; transform: none; }
  .buy-name { font-weight: 600; letter-spacing: -0.015em; transition: color .25s; }
  .buy-qty { font-size: 14px; color: var(--text-3); }
  .buy.done .buy-name { color: var(--text-3); text-decoration: line-through; text-decoration-thickness: 1.5px; }
  .buy-price { font-variant-numeric: tabular-nums; font-weight: 500; color: var(--text-2); }
  .sheet-empty { text-align: center; padding: 28px 24px 36px; }
  .sheet-empty .ok-badge { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 16px; display: grid; place-items: center; background: rgba(52,199,89,.14); color: var(--ok); }
  .sheet-empty .ok-badge svg { width: 30px; height: 30px; }
  .sheet-empty p { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
  .sheet-empty small { display: block; margin-top: 4px; font-size: 15px; color: var(--text-3); }
  .sheet-foot { padding: 12px 24px 20px; border-top: 0.5px solid var(--line); }
  .totals { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
  .totals .lbl { font-size: 15px; color: var(--text-2); }
  .totals .big { font-family: var(--font-display); font-size: 30px; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  .totals.small { margin-top: 2px; }
  .totals.small .v { font-size: 15px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .sheet-actions { display: grid; grid-template-columns: auto 1fr; gap: 10px; margin-top: 16px; }
  .btn {
    height: 50px; padding: 0 20px; border-radius: 14px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    font-size: 16px; font-weight: 600; letter-spacing: -0.015em;
    transition: transform .2s var(--spring), opacity .2s, background-color .2s;
  }
  .btn:active { transform: scale(.97); }
  .btn svg { width: 18px; height: 18px; }
  .btn.ghost { background: var(--fill-2); color: var(--text); }
  .btn.ghost:hover { background: var(--fill); }
  .btn.primary { background: var(--focus); color: #fff; }
  .btn.primary:hover { opacity: .9; }

  .toast {
    position: fixed; left: 50%; bottom: max(28px, env(safe-area-inset-bottom)); z-index: 80;
    transform: translate(-50%, 20px); opacity: 0;
    display: inline-flex; align-items: center; gap: 8px;
    padding: 11px 18px; border-radius: 999px;
    background: var(--text); color: var(--bg);
    font-size: 15px; font-weight: 600; letter-spacing: -0.015em;
    box-shadow: var(--shadow-lg);
    transition: opacity .3s var(--ease), transform .4s var(--spring);
    pointer-events: none; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast svg { width: 16px; height: 16px; color: var(--ok); }

  /* =========================================================
     Responsive
     ========================================================= */
  @media (max-width: 860px) and (min-width: 721px) {
    .tabs a svg { display: none; }
  }
  @media (min-width: 721px) {
    .sheet-wrap { align-items: center; padding: 24px; }
    .sheet { border-radius: 28px; transform: translateY(24px) scale(.97); opacity: 0; transition: transform .45s var(--ease), opacity .3s var(--ease), background-color .5s var(--ease); }
    .sheet-wrap.open .sheet { transform: none; opacity: 1; }
    .grabber { display: none; }
    .sheet-head { padding-top: 22px; }
  }
  @media (max-width: 760px) {
    .hero { grid-template-columns: 1fr; }
    .strip { justify-self: stretch; grid-template-columns: repeat(7, 1fr); }
  }
  @media (max-width: 720px) {
    .nav-in { padding: 0 16px; }
    .wrap { padding: 36px 16px 56px; }
    .cards { grid-template-columns: 1fr; gap: 12px; }
    .card { min-height: 0; flex-direction: row; align-items: center; gap: 16px; padding: 18px 20px; }
    .card-text { display: flex; flex-direction: column; }
    .card-area { margin-top: 0; font-size: 14px; }
    .card-person { margin-top: 0; padding-top: 0; font-size: 26px; }
    .card-tag { top: 50%; inset-inline-end: 20px; transform: translateY(-50%) translateX(4px); }
    .card.is-mine .card-tag { transform: translateY(-50%); }
    .toolbar { margin-top: 28px; }
    .seg { width: 100%; }
    .seg button { padding: 7px 6px; }
    .weeknav { width: 100%; }
    .row { grid-template-columns: 1fr; gap: 8px; padding: 16px 20px; }
    .row.head { display: none; }
    .row.head + .row { border-top: 0; }
    .people { display: flex; flex-wrap: wrap; gap: 6px 18px; }
    .who .area-m { display: inline; }
    .section-title { margin-top: 56px; font-size: 28px; }
    .stage-close span { display: none; }

    .tabs { display: none; }
    .tabbar {
      display: grid; grid-template-columns: 1fr 1fr;
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
      background: var(--nav);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      backdrop-filter: saturate(180%) blur(20px);
      border-top: 0.5px solid var(--line);
      padding: 7px 0 max(8px, env(safe-area-inset-bottom));
    }
    .tabbar a {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      font-size: 11px; font-weight: 500; letter-spacing: 0;
      color: var(--text-3); text-decoration: none;
      transition: color .2s;
    }
    .tabbar a svg { width: 25px; height: 25px; }
    .tabbar a[aria-current="page"] { color: var(--focus); }
    body { padding-bottom: calc(60px + env(safe-area-inset-bottom)); }
    .toast { bottom: calc(76px + env(safe-area-inset-bottom)); }

    .trash { flex-wrap: wrap; gap: 12px 16px; }
    .trash-who { width: 100%; justify-content: flex-start; padding-inline-start: 62px; }
    .ck-head .cta { width: 100%; justify-content: center; }
    .item { gap: 14px; padding: 14px 16px; }
    .item-icon { width: 40px; height: 40px; border-radius: 11px; }
    .item-icon svg { width: 21px; height: 21px; }
    .step { width: 34px; height: 34px; }
    .count { min-width: 44px; }
    .sheet-actions { grid-template-columns: 1fr; }
    .sheet-actions .btn.ghost { order: 2; }
  }
  @media (min-width: 721px) { .card-text { display: contents; } }
  @media (max-width: 420px) {
    .brand-name { display: none; }
    .standby-label { display: none; }
    .icon-btn.solid { padding: 0 10px; }
  }
</style>

        <a href="#checklist" data-view="checklist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 6.5 1.6 1.6L8.5 5.2M4 12.5l1.6 1.6 2.9-2.9M4 18.5l1.6 1.6 2.9-2.9M11.5 7H20M11.5 13H20M11.5 19H20"/></svg><span data-t="tabChecklist">Checklist</span></a>

    poke();
    var bar = e.target.closest(".bar");
    if (bar) { slideIdx = +bar.getAttribute("data-i"); renderSlide(false); return; }
    var rtl = T().dir === "rtl";
    var left = e.clientX < window.innerWidth / 3;
    go(left !== rtl ? -1 : 1);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { if (stageOpen) closeStage(); toggleMenu(false); return; }
    if (!stageOpen) return;
    var rtl = T().dir === "rtl";
    if (e.key === "ArrowRight") { poke(); go(rtl ? -1 : 1); }
    else if (e.key === "ArrowLeft") { poke(); go(rtl ? 1 : -1); }
    else if (e.key === " ") { e.preventDefault(); poke(); go(1); }
  });
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && stageOpen) lockWake();
  });

  /* ---------------------------------------------------------
     Scorte: salvataggio locale + sincronizzazione Firebase (REST)
     --------------------------------------------------------- */
  var Store = (function () {
    var KEY = "pulizie.scorte";
    var listeners = [];
    var pending = {};
    var es = null, retry = null;
    var mode = DB_URL ? "connecting" : "local";
    var state = { scorte: {}, aggiornato: 0 };

    function clamp(v) { v = Math.round(+v); return isFinite(v) ? Math.max(0, Math.min(99, v)) : 0; }
    function defaults() { var o = {}; PRODUCTS.forEach(function (p) { o[p.id] = p.stock; }); return o; }
    function normalize(sc) {
      var o = defaults();
      if (sc && typeof sc === "object") for (var k in o) if (sc[k] != null) o[k] = clamp(sc[k]);
      return o;
    }
    try {
      var saved = JSON.parse(localStorage.getItem(KEY) || "null");
      if (saved) state = { scorte: saved.scorte, aggiornato: +saved.aggiornato || 0 };
    } catch (e) {}
    state.scorte = normalize(state.scorte);

    function persist() { save(KEY, JSON.stringify(state)); }
    function emit() { listeners.forEach(function (f) { f(); }); }
    function setMode(m) { if (mode !== m) { mode = m; emit(); } }
    function base() { return DB_URL.replace(/\/+$/, "") + "/casa"; }

    function flush() {
      if (!DB_URL || mode !== "online") return;
      var keys = Object.keys(pending);
      if (!keys.length) return;
      var body = { aggiornato: { ".sv": "timestamp" } };
      keys.forEach(function (k) { body["scorte/" + k] = pending[k]; });
      var sent = pending; pending = {};
      fetch(base() + ".json", { method: "PATCH", body: JSON.stringify(body) })
        .then(function (r) { if (!r.ok) throw new Error(r.status); })
        .catch(function () {
          for (var k in sent) if (!(k in pending)) pending[k] = sent[k];
          setMode("offline");
        });
    }

    function applyPut(path, data) {
      var parts = path.split("/").filter(Boolean);
      if (!parts.length) {
        state.scorte = normalize(data && data.scorte);
        state.aggiornato = (data && +data.aggiornato) || 0;
      } else if (parts[0] === "scorte") {
        if (parts.length === 1) state.scorte = normalize(data);
        else if (parts[1] in state.scorte) {
          var p = PRODUCTS.filter(function (x) { return x.id === parts[1]; })[0];
          state.scorte[parts[1]] = data == null ? p.stock : clamp(data);
        }
      } else if (parts[0] === "aggiornato") {
        state.aggiornato = +data || 0;
      }
    }

    function onEvent(e, isPatch) {
      var msg;
      try { msg = JSON.parse(e.data); } catch (err) { return; }
      if (!msg) return;
      if (!isPatch && msg.path === "/" && msg.data == null) {
        // Database vuoto: lo inizializzo con le scorte di questo dispositivo.
        mode = "online";
        pending = Object.assign({}, state.scorte);
        flush(); emit();
        return;
      }
      if (isPatch) {
        for (var k in msg.data) applyPut((msg.path === "/" ? "" : msg.path) + "/" + k, msg.data[k]);
      } else {
        applyPut(msg.path, msg.data);
      }
      for (var id in pending) state.scorte[id] = pending[id];
      persist();
      mode = "online";
      emit();
    }

    function connect() {
      if (!DB_URL || !window.EventSource) return;
      clearTimeout(retry);
      if (es) es.close();
      es = new EventSource(base() + ".json");
      es.addEventListener("put", function (e) { onEvent(e, false); });
      es.addEventListener("patch", function (e) { onEvent(e, true); });
      es.addEventListener("cancel", function () { setMode("offline"); });
      es.onopen = function () { setMode("online"); flush(); };
      es.onerror = function () {
        setMode("offline");
        if (es.readyState === 2) retry = setTimeout(connect, 8000);
      };
    }
    window.addEventListener("online", function () { if (DB_URL) connect(); });

    function setMany(obj) {
      for (var id in obj) {
        var v = clamp(obj[id]);
        state.scorte[id] = v;
        pending[id] = v;
      }
      state.aggiornato = Date.now();
      persist(); emit(); flush();
    }

    return {
      get: function (id) { return state.scorte[id]; },
      set: function (id, v) { var o = {}; o[id] = v; setMany(o); },
      setMany: setMany,
      mode: function () { return mode; },
      updated: function () { return state.aggiornato; },
      on: function (f) { listeners.push(f); },
      connect: connect
    };
  })();

  /* ---------------------------------------------------------
     Checklist: rendering
     --------------------------------------------------------- */
  var MINUS = SVG('<path d="M5 12h14"/>', 2.4), PLUS = SVG('<path d="M12 5v14M5 12h14"/>', 2.4);

  function money(v) { return new Intl.NumberFormat(T().locale, { style: "currency", currency: "EUR" }).format(v); }
  function relTime(ts) {
    if (!ts) return "";
    var s = Math.round((ts - Date.now()) / 1000);
    var rtf = new Intl.RelativeTimeFormat(T().locale, { numeric: "auto" });
    var a = Math.abs(s);
    if (a < 45) return rtf.format(0, "second");
    if (a < 3600) return rtf.format(Math.round(s / 60), "minute");
    if (a < 86400) return rtf.format(Math.round(s / 3600), "hour");
    return rtf.format(Math.round(s / 86400), "day");
  }

  // Cosa manca: per ogni prodotto sotto scorta, quante confezioni servono.
  function shoppingList() {
    return PRODUCTS.map(function (p) {
      var have = Store.get(p.id);
      var missing = Math.max(0, p.stock - have);
      var packs = Math.ceil(missing / p.pack);
      return { p: p, have: have, packs: packs, cost: packs * p.price };
    }).filter(function (x) { return x.packs > 0; });
  }

  function renderSync() {
    var t = T(), m = Store.mode(), el = $("sync");
    el.className = "sync rise " + m;
    var txt = m === "online" ? t.syncOnline + (Store.updated() ? " · " + t.updated + " " + relTime(Store.updated()) : "")
      : m === "offline" ? t.syncOffline : m === "connecting" ? t.syncConnecting : t.syncLocal;
    el.querySelector("span").textContent = txt;
  }

  function renderChecklist(bumpId) {
    var t = T();
    var html = "";
    GROUPS.forEach(function (g) {
      html += '<h2 class="group-title">' + t.groups[g] + '</h2><div class="list">';
      PRODUCTS.filter(function (p) { return p.group === g; }).forEach(function (p) {
        var have = Store.get(p.id);
        var ratio = Math.min(1, have / p.stock);
        var st = have === 0 ? " empty" : have < p.stock ? " low" : "";
        var tp = t.products[p.id];
        html += '<div class="item' + st + '" data-id="' + p.id + '">' +
          '<div class="item-icon">' + PICONS[p.id] + '</div>' +
          '<div class="item-main"><p class="item-name">' + tp.name + '</p>' +
          '<p class="item-meta">' + money(p.price) + ' · ' + tp.pack + '</p>' +
          '<div class="level"><i style="width:' + (ratio * 100) + '%"></i></div></div>' +
          '<div class="stepper">' +
            '<button class="step" data-d="-1" aria-label="' + t.less + ' – ' + tp.name + '"' + (have <= 0 ? " disabled" : "") + '>' + MINUS + '</button>' +
            '<span class="count" aria-live="polite"><b' + (bumpId === p.id ? ' class="tick"' : '') + '>' + num(have) + '</b><small>' + t.stockOf(num(p.stock)) + '</small></span>' +
            '<button class="step" data-d="1" aria-label="' + t.more + ' – ' + tp.name + '"' + (have >= 99 ? " disabled" : "") + '>' + PLUS + '</button>' +
          '</div></div>';
      });
      html += '</div>';
    });
    $("ckList").innerHTML = html;

    var list = shoppingList();
    $("ckSub").innerHTML = list.length ? t.ckSubLow(list.length, num) : t.ckSubOk;
    var badge = $("spesaBadge");
    var nb = list.length ? num(list.length) : "";
    if (badge.textContent !== nb) {
      badge.textContent = nb;
      badge.classList.remove("bump"); void badge.offsetWidth; if (nb) badge.classList.add("bump");
    }
    renderSync();
  }

  $("ckList").addEventListener("click", function (e) {
    var b = e.target.closest(".step");
    if (!b || b.disabled) return;
    var id = b.closest(".item").getAttribute("data-id");
    Store.set(id, Store.get(id) + (+b.getAttribute("data-d")));
    if (navigator.vibrate) navigator.vibrate(8);
    renderChecklist(id);
  });

  /* ---------------------------------------------------------
     Foglio "Spesa"
     --------------------------------------------------------- */
  var sheetOpen = false, ticked = {}, lastFocus = null;

  function renderSheet() {
    var t = T(), list = shoppingList();
    list.forEach(function (x) { if (!(x.p.id in ticked)) ticked[x.p.id] = false; });
    var total = list.reduce(function (s, x) { return s + x.cost; }, 0);
    var nTicked = list.filter(function (x) { return ticked[x.p.id]; }).length;

    $("sheetSub").textContent = list.length ? t.sheetSub(list.length, num) : "";
    $("sheetSub").style.display = list.length ? "" : "none";

    if (!list.length) {
      $("sheetBody").innerHTML = '<div class="sheet-empty"><div class="ok-badge">' + CHECK + '</div><p>' + t.emptyTitle + '</p><small>' + t.emptySub + '</small></div>';
      $("sheetFoot").innerHTML = '<div class="sheet-actions" style="grid-template-columns:1fr"><button class="btn ghost" data-act="close">' + t.close + '</button></div>';
      return;
    }

    $("sheetBody").innerHTML = list.map(function (x) {
      var tp = t.products[x.p.id];
      return '<button class="buy' + (ticked[x.p.id] ? " done" : "") + '" data-id="' + x.p.id + '" role="checkbox" aria-checked="' + !!ticked[x.p.id] + '">' +
        '<span class="box">' + CHECK + '</span>' +
        '<span><span class="buy-name">' + tp.name + '</span><br><span class="buy-qty">' + num(x.packs) + ' × ' + tp.pack + '</span></span>' +
        '<span class="buy-price">' + money(x.cost) + '</span></button>';
    }).join("");

    $("sheetFoot").innerHTML =
      '<div class="totals"><span class="lbl">' + t.total + '</span><span class="big">' + money(total) + '</span></div>' +
      '<div class="totals small"><span class="lbl">' + t.perHead + ' (÷ ' + num(PEOPLE.length) + ')</span><span class="v">' + money(total / PEOPLE.length) + '</span></div>' +
      '<div class="sheet-actions">' +
        '<button class="btn ghost" data-act="share">' + SVG('<path d="M12 3v12M8 7l4-4 4 4"/><path d="M6 11v8.5A1.5 1.5 0 0 0 7.5 21h9a1.5 1.5 0 0 0 1.5-1.5V11"/>', 2) + t.share + '</button>' +
        '<button class="btn primary" data-act="bought">' + CHECK + (nTicked ? t.boughtSome(nTicked, num) : t.boughtAll) + '</button>' +
      '</div>';
  }

  function openSheet() {
    ticked = {};
    lastFocus = document.activeElement;
    renderSheet();
    sheetOpen = true;
    $("sheet").classList.add("open");
    $("sheet").setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
    setTimeout(function () { $("sheetClose").focus(); }, 50);
  }
  function closeSheet() {
    if (!sheetOpen) return;
    sheetOpen = false;
    $("sheet").classList.remove("open");
    $("sheet").setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";
    if (lastFocus) lastFocus.focus();
  }

  var toastTimer = null;
  function toast(msg) {
    var el = $("toast");
    el.innerHTML = CHECK + "<span>" + msg + "</span>";
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove("show"); }, 2200);
  }

  function shareList() {
    var t = T(), list = shoppingList();
    var total = list.reduce(function (s, x) { return s + x.cost; }, 0);
    var text = t.shareTitle + ":\n" + list.map(function (x) {
      return "• " + t.products[x.p.id].name + " — " + num(x.packs) + " × " + t.products[x.p.id].pack + " (" + money(x.cost) + ")";
    }).join("\n") + "\n" + t.total + ": " + money(total);
    if (navigator.share) {
      navigator.share({ title: t.shareTitle, text: text }).catch(function () {});
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(function () { toast(t.copied); }).catch(function () {});
    }
  }

  $("spesaBtn").addEventListener("click", openSheet);
  $("sheetClose").addEventListener("click", closeSheet);
  $("sheetBackdrop").addEventListener("click", closeSheet);
  $("sheetBody").addEventListener("click", function (e) {
    var b = e.target.closest(".buy");
    if (!b) return;
    var id = b.getAttribute("data-id");
    ticked[id] = !ticked[id];
    if (navigator.vibrate) navigator.vibrate(6);
    renderSheet();
  });
  $("sheetFoot").addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]");
    if (!b) return;
    var act = b.getAttribute("data-act");
    if (act === "close") closeSheet();
    else if (act === "share") shareList();
    else if (act === "bought") {
      var list = shoppingList();
      var any = list.some(function (x) { return ticked[x.p.id]; });
      var upd = {};
      list.forEach(function (x) { if (!any || ticked[x.p.id]) upd[x.p.id] = x.have + x.packs * x.p.pack; });
      Store.setMany(upd);
      ticked = {};
      renderChecklist(false);
      toast(T().restocked);
      if (shoppingList().length) renderSheet(); else closeSheet();
    }
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && sheetOpen) closeSheet(); });

  Store.on(function () {
    renderChecklist(false);
    if (sheetOpen) renderSheet();
  });

  /* ---------------------------------------------------------
     Viste: Turni / Checklist
     --------------------------------------------------------- */
  var view = "";
  function setView(v, scroll) {
    if (v === view) return;
    view = v;
    document.body.setAttribute("data-view", v);
    $("viewTurni").hidden = v !== "turni";
    $("viewChecklist").hidden = v !== "checklist";
    document.querySelectorAll("a[data-view]").forEach(function (a) {
      if (a.getAttribute("data-view") === v) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
    if (v === "checklist") renderChecklist(false);
    else requestAnimationFrame(function () { moveThumb(true); });
    if (scroll) window.scrollTo(0, 0);
  }
  function route(scroll) {
    var h = location.hash.replace("#", "");
    setView(h === "checklist" ? "checklist" : "turni", scroll);
    if (h === "standby") openStage();
  }
  window.addEventListener("hashchange", function () { route(true); });

  /* ---------------------------------------------------------
     Avvio
     --------------------------------------------------------- */
  renderStatic();
  render(false);
  applyPerson(true);
  route(false);
  Store.connect();
  setInterval(function () { if (view === "checklist") renderSync(); }, 30000);

  window.addEventListener("resize", function () { moveThumb(true); });
  window.addEventListener("scroll", function () { $("nav").classList.toggle("scrolled", window.scrollY > 4); }, { passive: true });

  // Se la pagina resta aperta per giorni, si aggiorna da sola al cambio di data.
  var lastDay = startOfDay(new Date()).getTime();
  setInterval(function () {
    var d = startOfDay(new Date()).getTime();
    if (d !== lastDay) { lastDay = d; render(false); }
  }, 60000);

  if (params.has("standby")) openStage();
})();
</script>
</body>
